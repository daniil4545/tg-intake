# Локальный контур: та же цепочка postgres -> migrate -> app, что в dev.
# Креды базы прямо здесь: это postgres на ноутбуке, наружу он не смотрит.
# Токен и белый список берутся из .env, в репозиторий он не попадает.
#
# docker compose up -d postgres - только база, дальше make run
# docker compose up             - вся цепочка, как в dev-контуре
#
# Имя проекта задано явно: по умолчанию Compose берёт его из имени каталога, а
# каталог здесь «src», как у соседних сервисов платформы. Без этой строки
# команды одного проекта управляют контейнерами другого.
name: intake

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: intake
      POSTGRES_DB: intake
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake -d intake"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://intake:intake@postgres:5432/intake?sslmode=disable
    command: ["/goose", "-dir", "/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    # Ключ OpenRouter, модель и MAX_ITEMS приезжают из .env вместе с токеном
    # бота; MEDIA_DIR задаём здесь, чтобы он совпал с tmpfs: там же лежит
    # отметка живости опроса, которую читает healthcheck.
    env_file: .env
    environment:
      DATABASE_URL: postgres://intake:intake@postgres:5432/intake?sslmode=disable
      ENV: local
      MEDIA_DIR: /tmp/intake
    # tmpfs для короткоживущих файлов обращений, режим намеренно не задан:
    # подробности в deploy/prod/docker-compose.coolify.yml.
    volumes:
      - type: tmpfs
        target: /tmp/intake
        tmpfs:
          size: 268435456
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Проверяет базу и свежесть отметки опроса Telegram: контейнер с живой
      # базой и молчащим поллером здоровым не считается. Запас на старт больше
      # цикла опроса - первая отметка появляется только после getUpdates.
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 45s

volumes:
  postgres_data:
