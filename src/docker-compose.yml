# Локальная база для разработки. Креды прямо здесь: это postgres на ноутбуке,
# наружу он не смотрит, секрета в нём нет. Боевой стек - deploy/dev.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: intake
      POSTGRES_DB: intake
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake -d intake"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
