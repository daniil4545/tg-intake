# Dev-контур intake в Coolify. Источник правды - этот файл: workflow
# синхронизирует его в Coolify перед каждым выкатом, править в UI нельзя.
# Шага backup здесь нет: в dev нет данных, потерю которых стоит переживать.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: intake
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake -d intake"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "intake-dev-{{.Name}}"

  migrate:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    exclude_from_hc: true
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://intake:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/intake?sslmode=disable
    command: ["/goose", "-dir", "/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: journald
      options:
        tag: "intake-dev-{{.Name}}"

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    # С этого VPS дефолтный IP api.telegram.org (149.154.166.110) недоступен:
    # getMe уходит в i/o timeout, приложение уходит в перезапуск. Пин на DC
    # 149.154.167.220, как у соседнего Bot API сервиса. Проверено 2026-08-08.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    environment:
      DATABASE_URL: postgres://intake:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/intake?sslmode=disable
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS:?TELEGRAM_ALLOWED_IDS must be set}
      # Пусто - идём напрямую через закреплённый DC. Заполняется адресом
      # SOCKS-туннеля хоста, как у соседних сервисов.
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?OPENROUTER_API_KEY must be set}
      # Прямой путь к OpenRouter с этого хоста закрыт: запрос возвращает 403 от
      # фильтра по дороге, а не ответ API. Адрес прокси - секрет контура, в
      # репозиторий не попадает. Telegram и GitHub идут напрямую, их не трогаем.
      OPENROUTER_PROXY: ${OPENROUTER_PROXY:?OPENROUTER_PROXY must be set}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?GITHUB_TOKEN must be set}
      # Дефолты модели и лимитов лежат в config.go: пустая переменная означает
      # дефолт, а не пустое значение. Копия значений здесь молча разъехалась бы
      # с кодом.
      OPENROUTER_MODEL_MEDIA: ${OPENROUTER_MODEL_MEDIA:-}
      OPENROUTER_MODEL_DIALOG: ${OPENROUTER_MODEL_DIALOG:-}
      MAX_ITEMS: ${MAX_ITEMS:-}
      INTERVIEW_ROUNDS: ${INTERVIEW_ROUNDS:-}
      AUDIO_CONVERT: ${AUDIO_CONVERT:-}
      # Список проектов контура: имена и адреса внутренних репозиториев живут
      # только в переменной Coolify, репозиторий сервиса публичный. Пусто -
      # таблица проектов остаётся как есть.
      PROJECTS: ${PROJECTS:-}
      MEDIA_DIR: /tmp/intake
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: dev
    # Файлы обращения живут минуты и стираются после нормализации: диску их
    # переживать незачем. Режим не задаём: tmpfs монтируется с 1777, чего
    # хватает образу distroless:nonroot, а `mode: 01777` ломает разбор Compose -
    # ведущий ноль делает значение строкой, Docker ждёт число.
    volumes:
      - type: tmpfs
        target: /tmp/intake
        tmpfs:
          size: 268435456
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "intake-dev-{{.Name}}"

volumes:
  postgres_data:
