# Dev-контур intake в Coolify. Источник правды - этот файл: workflow
# синхронизирует его в Coolify перед каждым выкатом, править в UI нельзя.
# Шага backup здесь нет: в dev нет данных, потерю которых стоит переживать.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: intake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: intake
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intake -d intake"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "intake-dev-{{.Name}}"

  migrate:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    exclude_from_hc: true
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DATABASE_URL:?DATABASE_URL must be set}
    command: ["/goose", "-dir", "/migrations", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging:
      driver: journald
      options:
        tag: "intake-dev-{{.Name}}"

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
      TELEGRAM_ALLOWED_IDS: ${TELEGRAM_ALLOWED_IDS:?TELEGRAM_ALLOWED_IDS must be set}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENV: dev
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 7s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: journald
      options:
        tag: "intake-dev-{{.Name}}"

volumes:
  postgres_data:
